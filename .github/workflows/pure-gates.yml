# pure-gates - every push.
#
#   fmt      cargo fmt --check
#   clippy   cargo clippy --all-targets, warnings are errors
#   tests    cargo test
#
# This crate is a dependency of every DroneEngage Rust server: a broken
# push here breaks every consumer.
#
# No servers, no network.
name: pure-gates
on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: tests
        run: cargo test
