# pure-gates - every push, pure logic only.
#
#   smoke    `require('./index.js')` - the package must load clean.
#            server_common is a dependency of all three Node.js
#            servers, so a broken push here breaks every consumer.
#
# No servers, no SITL, no sim bring-up.
name: pure-gates
on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # package-lock.json is gitignored in this repo - npm install, not ci
      - name: install
        run: npm install --no-audit --no-fund

      - name: smoke load
        run: npm test
